<!DOCTYPE html>
<html>
<head>
    <title>Swiggy Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <h1>Swiggy</h1>
    <ul>
        <li>Home</li>
        <li>Offers</li>
        <li>Help</li>
        <li>Cart</li>
    </ul>
</nav>

<section>
    <h2>Order food online</h2>
    <p>Fast delivery at your doorstep</p>
    <input type="text" placeholder="Enter your location">
    <button>Search</button>
</section>

<div class="categories">
    <div class="food">Pizza</div>
    <div class="food">Burger</div>
    <div class="food">Biryani</div>
    <div class="food">Dosa</div>
</div>
<div class="restaurants">
    <div class="card">
        <h3>ABC Restaurant</h3>
        <p>4.5 ⭐</p>
        <p>30 mins</p>
    </div>

    <div class="card">
        <h3>Food Corner</h3>
        <p>4.2 ⭐</p>
        <p>25 mins</p>
    </div>

    <div class="card">
        <h3>Biryani Hub</h3>
        <p>4.7 ⭐</p>
        <p>20 mins</p>
    </div>
</div>

</body>
</html>
