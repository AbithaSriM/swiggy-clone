<!DOCTYPE html>
<html>
<head>
    <title>Swiggy Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <h1>Swiggy</h1>
    <ul>
        <li>Home</li>
        <li>Offers</li>
        <li>Help</li>
        <li>Cart</li>
    </ul>
</nav>

<section>
    <h2>Order food online</h2>
    <p>Fast delivery at your doorstep</p>
    <input type="text" placeholder="Enter your location">
    <button>Search</button>
</section>

<div class="categories">
    <div class="food">
        <img src="images/pizza.jpg" width="100">
        <p>Pizza</p>
    </div>

    <div class="food">
        <img src="images/burger.jpg" width="100">
        <p>Burger</p>
    </div>

    <div class="food">
        <img src="images/biryani.jpg" width="100">
        <p>Biryani</p>
    </div>

    <div class="food">
        <img src="images/dosa.jpg" width="100">
        <p>Dosa</p>
    </div>
</div>
<div class="restaurants">
    <div class="card">
        <img src="images/rest1.jpg" width="200">
        <h3>ABC Restaurant</h3>
        <p>4.5 ⭐</p>
        <p>30 mins</p>
        <button>Add to Cart</button>
        <button>Order Now</button> 
    </div>

    <div class="card">
        <img src="images/rest2.jpg" width="200">
        <h3>Food Corner</h3>
        <p>4.2 ⭐</p>
        <p>25 mins</p>
        <button>Add to Cart</button>
        <button>Order Now</button>
    </div>

    <div class="card">
        <img src="images/rest3.jpg" width="200">
        <h3>Biryani Hub</h3>
        <p>4.7 ⭐</p>
        <p>20 mins</p>
        <button>Add to Cart</button>
        <button>Order Now</button>
    </div>
</div>
<footer>
   <p>Contact us | About us</p>
</footer>
</body>
</html>
